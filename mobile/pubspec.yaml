name: task_manager_mobile
description: Task Management System – Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Calendar widget
  table_calendar: ^3.1.2

  # Date formatting
  intl: ^0.19.0

  # Loading skeleton
  shimmer: ^3.0.0

  # Cached network images (avatar)
  cached_network_image: ^3.3.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
